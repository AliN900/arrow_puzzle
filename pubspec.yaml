name: arrow_puzzle
description: "Arrow Puzzle: Tap Maze Escape — a clean, modern grid-based puzzle game built with Flutter."
publish_to: 'none'
version: 1.1.1+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flame: ^1.38.2
  flutter_riverpod: ^3.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  flutter_hooks: ^0.21.3+1
  unity_ads_plugin: ^0.5.0
  hooks_riverpod: ^3.4.3
  appwrite: ^27.0.0
  flutter_web_auth_2: ^5.1.0
  google_sign_in: ^7.2.0
  audioplayers: ^6.8.1
  intl: ^0.20.3
  huawei_iap: ^6.14.0+300
  device_info_plus: ^13.3.0
  huawei_in_app_update: ^1.2.2
  qr_flutter: ^4.1.0
  archive: ^4.5.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/sfx/
    - assets/audio/music/



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21